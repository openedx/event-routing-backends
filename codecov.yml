coverage:
  status:
    project:
      default:
        enabled: yes
        target: auto
        # This tooling migration (openedx/public-engineering#506) changed the
        # coverage measurement scope: */tests/* is now correctly omitted from
        # [tool.coverage.run] (the old .coveragerc never excluded test files
        # at all, so they inflated the reported project % since test files
        # execute almost all of their own lines). It also added two lines to
        # __init__.py's importlib.metadata lookup (the PackageNotFoundError
        # fallback branch) that can't be exercised while the package is
        # installed. Together these drop the reported total from 100.0% to
        # ~99.9% as a one-time methodology change, not a regression in
        # production-code coverage. This threshold absorbs that one-time
        # drop while still catching real future regressions.
        threshold: 1%
    patch:
      default:
        enabled: yes
        target: 100%

comment: false
